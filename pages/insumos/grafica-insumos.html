<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfica de insumos - Agro Verde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/insumos/insumos.css">
</head>

<body>
    <main class="pantalla container-fluid">
        <!-- Encabezado -->
        <header class="app-header">
            <div class="app-header__left">
                <a href="opciones-insumo.html" class="btn-back" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
                <h3 class="m-0 fw-bold">Gráfica de insumos</h3>
            </div>
            <img src="../../assets/img/agro-verde-sin-texto.png" alt="Agro Verde" class="app-logo-mini">
        </header>

        <div class="contenido-insumos">
            <div class="tarjeta p-3 rounded-4 mb-3">
                <p class="titulo-seccion">Uso de insumos - último mes (kg)</p>
                <div class="grafica">
                    <div class="barra-col">
                        <span class="valor">25 kg</span>
                        <div class="barra" style="height: 90%;"></div>
                    </div>
                    <div class="barra-col">
                        <span class="valor">9 kg</span>
                        <div class="barra" style="height: 32%;"></div>
                    </div>
                    <div class="barra-col">
                        <span class="valor">18 kg</span>
                        <div class="barra" style="height: 65%;"></div>
                    </div>
                    <div class="barra-col">
                        <span class="valor">12 kg</span>
                        <div class="barra" style="height: 43%;"></div>
                    </div>
                </div>
                <div class="grafica-etiquetas">
                    <span>Urea</span>
                    <span>Cobre</span>
                    <span>NPK</span>
                    <span>Cal</span>
                </div>
            </div>

            <a href="costos-por-insumo.html" class="btn-agro-primary">Ver detalle por insumo</a>
        </div>
    </main>

    <!-- Barra de navegación inferior -->
    <nav class="navegacion_inferior d-flex justify-content-between">
        <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
        <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
        <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
        <a href="insumos.html" class="text-center small active"><i class="bi bi-box-seam d-block"></i>Insumos</a>
        <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/insumos/insumos.js"></script>
</body>

</html>
