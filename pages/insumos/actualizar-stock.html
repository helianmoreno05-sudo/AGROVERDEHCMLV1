<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar stock - Agro Verde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/insumos/insumos.css">
</head>

<body>
    <main class="pantalla container-fluid">
        <!-- Encabezado -->
        <header class="app-header">
            <div class="app-header__left">
                <a href="opciones-insumo.html" class="btn-back" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
                <h3 class="m-0 fw-bold">Actualizar stock</h3>
            </div>
            <img src="../../assets/img/agro-verde-sin-texto.png" alt="Agro Verde" class="app-logo-mini">
        </header>

        <div class="contenido-insumos">
            <form action="insumos.html">
                <p class="titulo-seccion">Selecciona un insumo</p>
                <div class="d-flex flex-column gap-2 mb-3">
                <div class="opcion-insumo">
                    <input type="radio" name="insumo" id="s-npk" checked>
                    <label for="s-npk" class="tarjeta p-3 rounded-4">
                        <div>
                            <strong class="d-block">Fertilizante NPK</strong>
                            <span class="texto_gris small">18 sacos disponibles</span>
                        </div>
                        <i class="bi bi-circle"></i>
                    </label>
                </div>
                <div class="opcion-insumo">
                    <input type="radio" name="insumo" id="s-fungicida">
                    <label for="s-fungicida" class="tarjeta p-3 rounded-4">
                        <div>
                            <strong class="d-block">Fungicida orgánico</strong>
                            <span class="texto-bajo-stock small">3 unidades - bajo stock</span>
                        </div>
                        <i class="bi bi-circle"></i>
                    </label>
                </div>
                <div class="opcion-insumo">
                    <input type="radio" name="insumo" id="s-herbicida">
                    <label for="s-herbicida" class="tarjeta p-3 rounded-4">
                        <div>
                            <strong class="d-block">Herbicida selectivo</strong>
                            <span class="texto_gris small">9 litros disponibles</span>
                        </div>
                        <i class="bi bi-circle"></i>
                    </label>
                </div>
                </div>

                <p class="titulo-seccion">Ajustar stock</p>
                <span class="agro-label">Tipo de movimiento</span>
                <div class="pastillas">
                    <input type="radio" name="movimiento" id="s-entrada" value="entrada" checked>
                    <label for="s-entrada">Entrada</label>
                    <input type="radio" name="movimiento" id="s-salida" value="salida">
                    <label for="s-salida">Salida</label>
                </div>
                <span class="agro-label">Cantidad</span>
                <div class="contador" data-unidad="sacos">
                    <button type="button" aria-label="Restar">-</button>
                    <span>5 sacos</span>
                    <button type="button" aria-label="Sumar">+</button>
                    <input type="hidden" name="cantidad" value="5">
                </div>
                <label for="motivo" class="agro-label">Motivo</label>
                <input type="text" id="motivo" name="motivo" class="agro-input" placeholder="Ej. Compra a proveedor">

                <button type="submit" class="btn-agro-primary">Actualizar stock</button>
            </form>
        </div>
    </main>

    <!-- Barra de navegación inferior -->
    <nav class="navegacion_inferior d-flex justify-content-between">
        <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
        <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
        <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
        <a href="insumos.html" class="text-center small active"><i class="bi bi-box-seam d-block"></i>Insumos</a>
        <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/insumos/insumos.js"></script>
</body>

</html>
