<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insumos por siembra - Agro Verde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/insumos/insumos.css">
</head>

<body>
    <main class="pantalla container-fluid">
        <!-- Encabezado -->
        <header class="app-header">
            <div class="app-header__left">
                <a href="opciones-insumo.html" class="btn-back" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
                <h3 class="m-0 fw-bold">Insumos por siembra</h3>
            </div>
            <img src="../../assets/img/agro-verde-sin-texto.png" alt="Agro Verde" class="app-logo-mini">
        </header>

        <div class="contenido-insumos">
                <label for="siembra" class="agro-label">Seleccionar siembra</label>
                <select id="siembra" name="siembra" class="agro-select">
                    <option value="" selected disabled>Maíz - Lote 1</option>
                    <option>Maíz - Lote 1</option>
                    <option>Frijol - Lote 3</option>
                    <option>Café - Lote 2</option>
                </select>

            <div class="row g-2 mb-3">
                <div class="col">
                    <div class="tarjeta-resumen">
                        <div class="numero">3</div>
                        <span class="texto_gris small">Insumos usados</span>
                    </div>
                </div>
                <div class="col">
                    <div class="tarjeta-resumen">
                        <div class="numero">9</div>
                        <span class="texto_gris small">Cantidad total</span>
                    </div>
                </div>
                <div class="col">
                    <div class="tarjeta-resumen">
                        <div class="numero numero--alerta">1</div>
                        <span class="texto_gris small">Por agotarse</span>
                    </div>
                </div>
            </div>

            <p class="titulo-seccion">Insumos - Maíz - Lote 1</p>
            <div class="d-flex flex-column gap-2 mb-3">
                <div class="tarjeta p-3 rounded-4 d-flex justify-content-between align-items-center">
                    <div>
                        <strong class="d-block">Herbicida selectivo</strong>
                        <span class="texto_gris small">Control de maleza</span>
                    </div>
                    <i class="bi bi-check-circle-fill text-success"></i>
                </div>
                <div class="tarjeta p-3 rounded-4 d-flex justify-content-between align-items-center">
                    <div>
                        <strong class="d-block">Semilla de maíz</strong>
                        <span class="texto_gris small">50 kg disponibles</span>
                    </div>
                    <i class="bi bi-check-circle-fill text-success"></i>
                </div>
                <div class="tarjeta p-3 rounded-4 d-flex justify-content-between align-items-center">
                    <div>
                        <strong class="d-block">Fungicida orgánico</strong>
                        <span class="texto_gris small">Prevención de hongos</span>
                    </div>
                    <i class="bi bi-check-circle-fill text-success"></i>
                </div>
                <div class="tarjeta p-3 rounded-4 d-flex justify-content-between align-items-center">
                    <div>
                        <strong class="d-block">Fertilizante NPK</strong>
                        <span class="texto_gris small">Aplicado en floración</span>
                    </div>
                    <i class="bi bi-check-circle-fill text-success"></i>
                </div>
            </div>
        </div>
    </main>

    <!-- Barra de navegación inferior -->
    <nav class="navegacion_inferior d-flex justify-content-between">
        <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
        <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
        <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
        <a href="insumos.html" class="text-center small active"><i class="bi bi-box-seam d-block"></i>Insumos</a>
        <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/insumos/insumos.js"></script>
</body>

</html>
