<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo insumo - Agro Verde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/insumos/insumos.css">
</head>

<body>
    <main class="pantalla container-fluid">
        <!-- Encabezado -->
        <header class="app-header">
            <div class="app-header__left">
                <a href="insumos.html" class="btn-back" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
                <h3 class="m-0 fw-bold">Nuevo insumo</h3>
            </div>
            <img src="../../assets/img/agro-verde-sin-texto.png" alt="Agro Verde" class="app-logo-mini">
        </header>

        <div class="contenido-insumos">
            <form id="formCrearInsumo" action="insumos.html">
                <input type="hidden" name="mensaje" value="guardado">
                <label for="nombre" class="agro-label">Nombre del insumo</label>
                <input type="text" id="nombre" name="nombre" class="agro-input" placeholder="Ej. fertilizante">
                <label for="cantidad" class="agro-label">Cantidad insumo</label>
                <input type="number" id="cantidad" name="cantidad" class="agro-input" placeholder="Ej. 5">
                <label for="medida" class="agro-label">Medida del insumo</label>
                <select id="medida" name="medida" class="agro-select">
                    <option value="" selected disabled>Seleccionar medida</option>
                    <option value="kg">Kilogramos (kg)</option>
                    <option value="g">Gramos (g)</option>
                    <option value="L">Litros (L)</option>
                    <option value="mL">Mililitros (mL)</option>
                    <option value="sacos">Sacos</option>
                    <option value="bultos">Bultos</option>
                    <option value="und">Unidades</option>
                </select>
                <label for="precio" class="agro-label">Precio por unidad ($)</label>
                <input type="number" id="precio" name="precio" class="agro-input" placeholder="Ej. 63000" min="0" step="100">
                <label for="minimo" class="agro-label">Stock mínimo (avisar cuando quede esto o menos)</label>
                <input type="number" id="minimo" name="minimo" class="agro-input" placeholder="Ej. 5" min="0">
                <label for="llegada" class="agro-label">Fecha de llegada</label>
                <input type="date" id="llegada" name="llegada" class="agro-input">
                <label for="caducidad" class="agro-label">Fecha de caducidad</label>
                <input type="date" id="caducidad" name="caducidad" class="agro-input">
                <label for="cultivo" class="agro-label">Selecciona cultivo</label>
                <select id="cultivo" name="cultivo" class="agro-select">
                    <option value="" selected disabled>Seleccionar cultivo</option>
                    <option>Maíz - lote 1</option>
                    <option>Café - lote 3</option>
                    <option>Frijol - lote 4</option>
                    <option>Tomate - lote 5</option>
                </select>

                <button type="submit" class="btn-agro-primary mb-2">Guardar insumo</button>
                <a href="codigo-barras.html" class="btn-agro-outline"><i class="bi bi-upc-scan"></i> Guardar por código de barras</a>
            </form>
        </div>
    </main>

    <!-- Barra de navegación inferior -->
    <nav class="navegacion_inferior d-flex justify-content-between">
        <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
        <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
        <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
        <a href="insumos.html" class="text-center small active"><i class="bi bi-box-seam d-block"></i>Insumos</a>
        <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/comun.js"></script>
    <script src="../../assets/js/insumos/datos-insumos.js"></script>
    <script src="../../assets/js/insumos/insumos.js"></script>
    <script src="../../assets/js/confirmacion.js"></script>
</body>

</html>
