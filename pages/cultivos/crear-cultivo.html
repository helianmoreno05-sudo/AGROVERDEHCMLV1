<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Cultivo - Agro Verde</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Estilos globales y propios -->
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/cultivos/crear-cultivo.css">
</head>
<body>

  <main class="pantalla container px-3 py-3">

    <!-- Encabezado -->
    <header class="d-flex align-items-center justify-content-between mb-3">
      <div class="d-flex align-items-center gap-3">
        <a href="cultivos.html" class="btn-volver" aria-label="Volver">&#8592;</a>
        <h1 class="titulo m-0">Nuevo Cultivo</h1>
      </div>
      <img src="../../assets/img/agro-verde-sin-texto.png" alt="Agro Verde" class="app-logo-mini">
    </header>

    <form id="formCultivo" action="cultivos.html">
      <input type="hidden" name="mensaje" value="guardado">

      <!-- Nombre -->
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre del cultivo</label>
        <input type="text" id="nombre" name="nombre" class="form-control campo" placeholder="Ej. Café Castillo" required>
      </div>

      <!-- Tipo -->
      <div class="mb-3">
        <label for="tipo" class="form-label">Tipo de cultivo</label>
        <select id="tipo" name="tipo" class="form-select campo" required>
          <option value="" selected disabled>Seleccionar tipo</option>
          <option value="cafe">Café</option>
          <option value="maiz">Maíz</option>
          <option value="platano">Plátano</option>
          <option value="yuca">Yuca</option>
        </select>
      </div>

      <!-- Fecha -->
      <div class="mb-3">
        <label for="fecha" class="form-label">Fecha de siembra</label>
        <input type="date" id="fecha" name="fecha" class="form-control campo" required>
      </div>

      <!-- Área -->
      <div class="mb-3">
        <label for="area" class="form-label">Área sembrada (ha)</label>
        <input type="number" id="area" name="area" class="form-control campo" placeholder="Ej. 2.5" step="0.1" min="0" required>
      </div>

      <!-- Semilla -->
      <div class="mb-3">
        <label for="semilla" class="form-label">Selección de semilla</label>
        <select id="semilla" name="semilla" class="form-select campo">
          <option value="" selected disabled>Seleccionar semilla</option>
          <option value="certificada">Semilla certificada</option>
          <option value="criolla">Semilla criolla</option>
        </select>
      </div>

      <!-- Terreno -->
      <div class="mb-3">
        <span class="form-label d-block">Seleccionar terreno</span>

        <details class="terreno-desplegable" id="detalleTerreno">
          <summary class="campo campo-terreno" id="terrenoSeleccionado">
            Seleccione
          </summary>

          <ul class="lista-terrenos list-unstyled mt-2 mb-0">
            <li>
              <input type="radio" name="terreno" id="t1" value="terreno1" class="opcion-oculta">
              <label for="t1" class="terreno-item">Terreno 1</label>
            </li>
            <li>
              <input type="radio" name="terreno" id="t2" value="terreno-cafe" class="opcion-oculta">
              <label for="t2" class="terreno-item">Terreno de Café</label>
            </li>
            <li>
              <input type="radio" name="terreno" id="t3" value="terreno-loma" class="opcion-oculta">
              <label for="t3" class="terreno-item">Terreno Loma</label>
            </li>
          </ul>
        </details>
      </div>

      <!-- Cultivos recomendados -->
      <p class="form-label mb-2">Cultivos recomendados</p>
      <div class="row g-2 mb-3">
        <div class="col-4">
          <div class="card-reco">
            <span class="punto"></span>
            <strong class="nombre-reco">Maíz</strong>
            <small class="compat">94% compatibilidad</small>
          </div>
        </div>
        <div class="col-4">
          <div class="card-reco">
            <span class="punto"></span>
            <strong class="nombre-reco">Fríjol</strong>
            <small class="compat">89% compatibilidad</small>
          </div>
        </div>
        <div class="col-4">
          <div class="card-reco">
            <span class="punto"></span>
            <strong class="nombre-reco">Papa</strong>
            <small class="compat">85% compatibilidad</small>
          </div>
        </div>
      </div>

      <!-- Notas -->
      <div class="mb-4">
        <label for="notas" class="form-label">Notas (opcional)</label>
        <textarea id="notas" name="notas" class="form-control campo" rows="4" placeholder="Observaciones adicionales..."></textarea>
      </div>

      <!-- Botón -->
      <button type="submit" class="btn btn-guardar w-100">Guardar cultivo</button>

    </form>
  </main>

  <script>
    const items = document.querySelectorAll('.terreno-item');
    const campoTerreno = document.getElementById('terrenoSeleccionado');
    const detalleTerreno = document.getElementById('detalleTerreno');

    items.forEach(function (item) {
      item.addEventListener('click', function () {
        items.forEach(i => i.classList.remove('activo'));
        item.classList.add('activo');
        campoTerreno.textContent = item.textContent;
        campoTerreno.classList.add('con-valor');
        detalleTerreno.removeAttribute('open');
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="../../assets/js/comun.js"></script>
    <script src="../../assets/js/cultivos/cultivos.js"></script>
</body>
</html>
